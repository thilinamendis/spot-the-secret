<!doctype html>
<!--
  Spot the Secret: steganography game for the classroom
  Developed by Thilina Mendis
  Date: October 17, 2026

  Ten levels, two photos each. One photo hides a secret; a tool (Contrast
  Booster or X-ray) works on both photos at once to help find it.
  Level assets come from tools/generate_simple.py (levels_simple/).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="author" content="Thilina Mendis">
<title>Spot the Secret</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="simple.css">
</head>
<body>
<header class="hud" id="hud">
  <span class="hud-logo">Spot the Secret</span>
  <ol class="pips" id="pips" aria-label="Level progress"></ol>
  <div class="hud-stats">
    <div class="stat"><span class="stat-k">Score</span><span class="stat-v" id="hudScore">0</span></div>
  </div>
</header>

<main>
  <!-- Play -->
  <section id="screenPlay" class="screen">
    <div class="level-bar">
      <div>
        <p class="level-num" id="levelNum"></p>
        <h2 class="level-title" id="levelTitle" tabindex="-1"></h2>
      </div>
      <div class="difficulty" id="difficulty" aria-label="Difficulty"></div>
    </div>
    <p class="prompt" id="prompt">One of these photos hides a secret. Use the tool to find it.</p>

    <!-- The tool: its controls work on both photos at once -->
    <div class="toolbar" id="toolbar">
      <div class="tool-name">
        <b id="toolName"></b>
        <span class="seg view-seg" role="radiogroup" aria-label="What the photos show">
          <button type="button" role="radio" data-view="photo" aria-checked="true">Photos</button>
          <button type="button" role="radio" data-view="tool" aria-checked="false" id="toolViewBtn"></button>
        </span>
      </div>
      <div class="tool-controls" id="toolControls"></div>
      <p class="tool-help" id="toolHelp"></p>
    </div>

    <div class="arena" id="arena">
      <figure class="pane" data-side="A">
        <div class="frame">
          <canvas class="photo" width="768" height="512"></canvas>
          <div class="stamp" aria-hidden="true"></div>
          <span class="corner-tag">A</span>
        </div>
        <button class="pick" data-pick="A" type="button" disabled><span class="pick-key">A</span>A hides the secret</button>
      </figure>
      <figure class="pane" data-side="B">
        <div class="frame">
          <canvas class="photo" width="768" height="512"></canvas>
          <div class="stamp" aria-hidden="true"></div>
          <span class="corner-tag">B</span>
        </div>
        <button class="pick" data-pick="B" type="button" disabled><span class="pick-key">B</span>B hides the secret</button>
      </figure>
    </div>

    <div id="reveal" hidden>
      <div class="result" id="result" role="status" aria-live="polite">
        <p class="result-head" id="resultHead"></p>
        <p class="result-sub" id="resultSub"></p>
      </div>
      <div class="brief">
        <p class="brief-text" id="how"></p>
        <p class="brief-simple" id="plain"></p>
        <div class="actions">
          <button class="btn btn-go" id="nextBtn" type="button">Next level</button>
        </div>
      </div>
    </div>
    <p class="status" id="loadStatus" role="status"></p>
  </section>

  <!-- End -->
  <section id="screenEnd" class="screen" hidden>
    <p class="level-num">All 10 levels done</p>
    <h2 class="end-title" id="endTitle"></h2>
    <p class="rank" id="endRank"></p>
    <ol class="result-row" id="resultRow"></ol>
    <div class="actions">
      <button class="btn btn-go" id="againBtn" type="button">Play again</button>
    </div>
  </section>
</main>

<script src="stego.js"></script>
<script src="simple.js"></script>
</body>
</html>
